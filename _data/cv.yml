cv:
  name: Matthew A. Wright
  label: Quantum Foundry Postdoctoral Associate
  email: matthew-wright@ucsb.edu
  location: Santa Barbara, California, USA
  image: ""
  summary: >
    I am a solid-state materials chemist working on battery and quantum materials.
    I study how structure governs function in inorganic solids to develop rational
    design principles for new functional materials. I combine solid-state synthesis
    with electrochemistry as a synthetic tool for tuning composition and electronic
    structure, and use X-ray and neutron scattering alongside spectroscopy to resolve
    the structural origins of ionic, electronic, and magnetic behavior.

